# XcodeGen spec. Regenerate the project after editing: `xcodegen generate`.
# Never edit Cumba.xcodeproj by hand; it is generated and gitignored.
name: Cumba

options:
  bundleIdPrefix: io.github.muazfurkan
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2
  usesTabs: false

packages:
  # The only dependency. MIT licensed. Pinned to the commit of tag
  # 0.27.1 (a tag can move), because the generated project and Package.resolved aren't
  # committed.
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    revision: 4e246d3fb515bd2069e5c169abdc75808b90548f

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    # Single source of the app version. Release builds override it from the git tag.
    MARKETING_VERSION: 0.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Cumba:
    type: application
    platform: macOS
    sources:
      - path: Cumba
      # The Chrome extension ships inside the app so Settings can reveal it for
      # "Load unpacked".
      - path: extensions/chrome
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlyingFox
      # Copied into Contents/Frameworks and run inside /usr/bin/perl, never linked by the app.
      - target: CumbaNowPlaying
        embed: true
        link: false
        codeSign: true
        copy:
          destination: frameworks
    info:
      path: Cumba/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cumba
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar app: no Dock icon, no app menu bar.
        LSUIElement: true
        NSPrincipalClass: NSApplication
        # Translations live in InfoPlist.xcstrings.
        NSCalendarsFullAccessUsageDescription: Cumba shows your upcoming events in the notch. Nothing leaves your Mac.
        NSAppleEventsUsageDescription: Cumba reads what Spotify and Music are playing and sends play, pause, next and seek commands to them, and shows your recent Apple Notes and makes new ones.
        NSRemindersFullAccessUsageDescription: The To-dos widget shows your reminders and lets you tick them off and add new ones. Nothing leaves your Mac.
        NSRemindersUsageDescription: The To-dos widget shows your reminders and lets you tick them off and add new ones. Nothing leaves your Mac.
        NSCameraUsageDescription: The Mirror widget shows your camera while the panel is open. Nothing is recorded or sent.
        NSLocationUsageDescription: The Weather widget shows the weather where you are. Your location is rounded to about 10 km first.
        NSLocationWhenInUseUsageDescription: The Weather widget shows the weather where you are. Your location is rounded to about 10 km first.
    entitlements:
      path: Cumba/Resources/Cumba.entitlements
      properties:
        # Sandbox stays off for AppleScript automation and the local server.
        com.apple.security.app-sandbox: false
        # Hardened Runtime needs these for the matching permission prompts.
        com.apple.security.personal-information.calendars: true
        com.apple.security.automation.apple-events: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        # Kept from the app's former name, ljaspNotch: macOS ties permissions, settings and
        # Keychain items to it, so changing it would reset them for existing users.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muazfurkan.ljaspnotch
        PRODUCT_NAME: Cumba
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - CumbaTests

  # Reads the system's Now Playing. macOS answers that private API (MediaRemote) only for
  # Apple's own programs, so the app runs this library inside the system perl. See
  # NowPlayingHelper/CumbaNowPlaying.m and SECURITY.md.
  CumbaNowPlaying:
    type: library.dynamic
    platform: macOS
    sources:
      - path: NowPlayingHelper
    dependencies:
      - sdk: AppKit.framework
    settings:
      base:
        PRODUCT_NAME: CumbaNowPlaying
        EXECUTABLE_PREFIX: lib
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muazfurkan.ljaspnotch.nowplaying
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development

  CumbaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CumbaTests
    dependencies:
      - target: Cumba
      - package: FlyingFox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muazfurkan.ljaspnotch.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
