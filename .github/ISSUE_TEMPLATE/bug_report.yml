name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please do not paste tokens, Claude Code payloads (commands, file contents, messages) or personal file paths.** Security issues go through [private reporting](https://github.com/muazfurkan/ljaspNotch/security/advisories/new), not public issues.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings > General > Version
      placeholder: 0.1.0 (42)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: MacBook Pro 14-inch, M5
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Notch panel
        - Media (Spotify / Apple Music)
        - YouTube / Chrome extension
        - Claude Code
        - Widgets
        - Themes / Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Once available, paste the output of Settings > Copy Diagnostics. It contains no personal data.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, Claude Code payloads and personal file paths from this report.
          required: true
