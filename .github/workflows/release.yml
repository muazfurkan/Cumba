name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the small publish job below may write, and it runs no build
# tools: it signs provenance for and uploads the files the build job produced.
permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "TAG=$GITHUB_REF_NAME"
            echo "VERSION=$VERSION"
            # CFBundleShortVersionString allows only numbers, so drop any pre-release suffix.
            echo "MARKETING_VERSION=${VERSION%%-*}"
          } >> "$GITHUB_ENV"

      # The extension ships inside the app and as its own zip; keep its version in step.
      - name: Set extension version
        run: |
          python3 - "$MARKETING_VERSION" <<'PY'
          import json, sys
          path = "extensions/chrome/manifest.json"
          manifest = json.load(open(path))
          manifest["version"] = sys.argv[1]
          json.dump(manifest, open(path, "w"), indent=2)
          PY

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ljaspNotch.xcodeproj \
            -scheme ljaspNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Show compiler errors
        if: failure()
        run: |
          grep -nE "(error|warning): " xcodebuild.log | sort -u | head -50 || true
          grep -n -A12 "Stack dump:" xcodebuild.log | head -40 || true
          echo "--- last lines ---"
          tail -60 xcodebuild.log

      # Apple Silicon refuses to run unsigned apps; an ad-hoc signature is enough.
      # Hardened runtime and entitlements are kept so automation permissions work.
      - name: Sign ad-hoc
        run: |
          APP=build/Build/Products/Release/ljaspNotch.app
          codesign --force --deep --options runtime \
            --entitlements ljaspNotch/Resources/ljaspNotch.entitlements \
            --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/ljaspNotch.app "dist/ljaspNotch-$TAG.zip"
          if [ -d extensions/chrome ]; then
            (cd extensions/chrome && zip -qr "$GITHUB_WORKSPACE/dist/ljaspNotch-chrome-extension-$TAG.zip" .)
          fi
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)." > notes.md
          fi
          {
            echo
            echo "### Installing"
            echo
            echo "The app is ad-hoc signed and not notarized, so macOS warns on first launch."
            echo "Move it to Applications, then either allow it in System Settings > Privacy & Security > Open Anyway, or run:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine /Applications/ljaspNotch.app'
            echo '```'
            echo
            echo "### Verifying"
            echo
            echo "Check that a download was built by this repository's release workflow:"
            echo
            echo '```bash'
            echo "gh attestation verify ljaspNotch-$TAG.zip --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md

          cp notes.md dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Signed build provenance for the downloads (gh attestation verify).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          FLAGS=()
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          # Test tags such as v0.0.1-test create a draft that only maintainers can see.
          if [[ "$VERSION" == *-test* ]]; then FLAGS+=(--draft); fi
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "ljaspNotch $TAG" \
            --notes-file dist/notes.md \
            --verify-tag \
            "${FLAGS[@]}"
