name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the small publish job below may write, and it runs no build
# tools: it signs provenance for and uploads the files the build job produced.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "TAG=$GITHUB_REF_NAME"
            echo "VERSION=$VERSION"
            # CFBundleShortVersionString allows only numbers, so drop any pre-release suffix.
            echo "MARKETING_VERSION=${VERSION%%-*}"
          } >> "$GITHUB_ENV"

      # The extension ships inside the app and as its own zip; keep its version in step.
      - name: Set extension version
        run: |
          python3 - "$MARKETING_VERSION" <<'PY'
          import json, sys
          path = "extensions/chrome/manifest.json"
          manifest = json.load(open(path))
          manifest["version"] = sys.argv[1]
          json.dump(manifest, open(path, "w"), indent=2)
          PY

      # XcodeGen generates the project the app is built from, so it is a pinned, checksummed
      # release instead of whatever Homebrew has today. Update both values together.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Cumba.xcodeproj \
            -scheme Cumba \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          tail -3 xcodebuild.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -nE "(error|warning): " xcodebuild.log | sort -u | head -50 || true
          grep -n -A12 "Stack dump:" xcodebuild.log | head -40 || true
          echo "--- last lines ---"
          tail -60 xcodebuild.log

      # Apple Silicon refuses to run unsigned apps; an ad-hoc signature is enough.
      # Hardened runtime and entitlements are kept so automation permissions work.
      - name: Sign ad-hoc
        run: |
          APP=build/Build/Products/Release/Cumba.app
          codesign --force --deep --options runtime \
            --entitlements Cumba/Resources/Cumba.entitlements \
            --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          APP=build/Build/Products/Release/Cumba.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Cumba-$TAG.zip"
          # Disk image with an Applications shortcut, so installing is a single drag.
          mkdir -p dmg
          ditto "$APP" dmg/Cumba.app
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners; retry.
          for attempt in 1 2 3; do
            hdiutil create -volname Cumba -srcfolder dmg -fs HFS+ -format UDZO -ov \
              "dist/Cumba-$TAG.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          if [ -d extensions/chrome ]; then
            (cd extensions/chrome && zip -qr "$GITHUB_WORKSPACE/dist/Cumba-chrome-extension-$TAG.zip" .)
          fi
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)." > notes.md
          fi
          {
            echo
            echo "### Installing"
            echo
            echo "Open \`Cumba-$TAG.dmg\` and drag Cumba to Applications (or unzip the .zip and move the app there)."
            echo
            echo "The app is ad-hoc signed and not notarized, so macOS warns on first launch."
            echo "Open it once, then allow it in System Settings > Privacy & Security > Open Anyway, or run:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine /Applications/Cumba.app'
            echo '```'
            echo
            echo "### Verifying"
            echo
            echo "Check that a download was built by this repository's release workflow:"
            echo
            echo '```bash'
            echo "gh attestation verify Cumba-$TAG.dmg --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md

          cp notes.md dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Signed build provenance for the downloads (gh attestation verify).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          FLAGS=()
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          # Test tags such as v0.0.1-test create a draft that only maintainers can see.
          if [[ "$VERSION" == *-test* ]]; then FLAGS+=(--draft); fi
          gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cumba $TAG" \
            --notes-file dist/notes.md \
            --verify-tag \
            "${FLAGS[@]}"
