name: Build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint
        run: xcrun swift-format lint --strict --recursive ljaspNotch ljaspNotchTests

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ljaspNotch.xcodeproj \
            -scheme ljaspNotch \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      # xcbeautify can hide compiler errors; print the raw ones when the build fails.
      - name: Show compiler errors
        if: failure()
        run: |
          grep -nE "(error|warning): " xcodebuild.log | sort -u | head -50 || true
          grep -n -A12 "Stack dump:" xcodebuild.log | head -40 || true
          echo "--- last lines ---"
          tail -60 xcodebuild.log
